[project]
name = "esci-search"
version = "0.1.0"
description = "Hybrid product search evaluated on Amazon's ESCI dataset"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=16",
  "numpy>=1.26",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "hypothesis>=6",
  "scikit-learn>=1.5",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esci_search"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
files = ["src"]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "integration: needs local Docker services (make up-local)",
  "data: needs the real downloaded ESCI dataset",
  "gpu: needs CUDA",
]
